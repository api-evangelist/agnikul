method: derived
source: >-
  mcp/agnikul-ucp-mcp-tools.json and mcp/agnikul-storefront-mcp-tools.json (live tools/list,
  HTTP 200) crossed against the read-only HTTP routes the store itself names in
  https://shop.agnikul.in/agents.md and /llms.txt (HTTP 200), and the crawl rules in
  https://shop.agnikul.in/robots.txt (HTTP 200)
name: Agnikul Cosmos Store MCP tool crosswalk
slug: agnikul

caveat: >-
  Agnikul publishes no OpenAPI on any host, so the REST side of this crosswalk has no operationIds.
  Each row binds a tool to the documented HTTP route the store itself names in /agents.md, written as
  METHOD path. Confidence is graded accordingly and no row asserts more than the two documents state.

surfaces:
- name: UCP Commerce MCP
  kind: mcp
  url: https://shop.agnikul.in/api/ucp/mcp
  gated: false
  tool_count: 13
  schema_source: live tools/list
- name: Storefront MCP
  kind: mcp
  url: https://shop.agnikul.in/api/mcp
  gated: false
  tool_count: 1
  schema_source: live tools/list
- name: Storefront read-only JSON routes
  kind: rest
  base: https://shop.agnikul.in
  gated: false
  openapi: null
  documented_at: https://shop.agnikul.in/agents.md
  routes:
  - GET /collections/all
  - GET /products/{handle}
  - GET /products/{handle}.json
  - GET /collections/{handle}
