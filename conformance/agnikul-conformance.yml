domain_standards:
- id: ucp
  name: Universal Commerce Protocol
  market: agentic commerce / retail checkout
  declared_version: '2026-08-25'
  conforms: true
  graded: declared-in-contract
  evidence:
    url: https://shop.agnikul.in/.well-known/ucp
    http_status: 200
    location: 'ucp.services["dev.ucp.shopping"][0] and ucp.capabilities[*]'
    detail: >-
      The merchant profile is the UCP discovery document itself, not a prose claim. It declares the
      dev.ucp.shopping service over MCP transport at a named endpoint plus eight namespaced
      capabilities.
  capabilities_declared:
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.order
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.shopify.catalog
  fulfillment_config:
    multi_destination: []
    method_combinations: [[shipping]]
  spec: https://ucp.dev/2026-08-25/specification/overview/
  schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
  schema_ownership_note: >-
    The OpenRPC schema and JSON Schemas referenced by the profile are published by ucp.dev and
    shopify.dev — the standards body and the platform, not Agnikul. They are cited as the standard
    Agnikul declares conformance to and are deliberately NOT saved into this repo as Agnikul's own
    contract.
  agent_confirmation: >-
    The tool names returned by the live server (search_catalog, lookup_catalog, get_product,
    create_cart, update_cart, cancel_cart, get_cart, create_checkout, update_checkout,
    complete_checkout, cancel_checkout, get_checkout, get_order) match the declared capability set
    one-for-one.

- id: payment-handler-profiles
  name: UCP payment handler profiles
  conforms: true
  evidence:
    url: https://shop.agnikul.in/.well-known/ucp
    http_status: 200
    handlers:
    - com.google.pay 2026-01-11 (Google Pay API v2, PAN_ONLY + CRYPTOGRAM_3DS, gateway shopify)
    - dev.shopify.card 2026-01-15
    note: >-
      Only two handlers. dev.shopify.shop_pay is NOT declared, even though the store's own agents.md
      tells agents to route through Shop Pay when buyer approval cannot be obtained.

- id: iso4217
  name: 'ISO 4217 currency codes'
  conforms: true
  evidence:
    detail: All prices are integer minor units paired with an ISO 4217 code, stated in every tool description.
- id: iso3166-1
  name: 'ISO 3166-1 alpha-2 country codes'
  conforms: true
  evidence:
    detail: context.address_country and billing address country are documented as alpha-2.
- id: bcp47
  name: 'IETF BCP 47 language tags'
  conforms: true
  evidence:
    detail: context.language is documented as an IETF BCP 47 language tag.

space_sector_standards:
  probed: false
  note: >-
    The launch-services business has no machine-readable contract at all, so there is nothing to test
    against a space-sector interface standard (CCSDS, SANA, XTCE, SpaceX-style payload ICDs). This is
    a reward-only category and no conformance is invented to fill it. For the record, the company
    does publish one relevant quality credential in prose: Rocket Factory-01 is described as AS9100D
    certified in https://agnikul.in/llms-full.txt. That is a manufacturing quality-management
    certification, not an API or information-security one, and it is not carried into a Compliance
    pointer.

compliance_certifications:
  published: false
  note: >-
    Agnikul publishes no trust center and names no information-security certification (SOC 2,
    ISO 27001, PCI DSS, HIPAA, FedRAMP) on any page probed. Card data never touches an Agnikul system
    in the agent flow — it is tokenized by Google Pay or Shopify's card handler — but no PCI
    attestation is published by Agnikul itself. No Compliance pointer is claimed.
