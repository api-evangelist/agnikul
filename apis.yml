aid: agnikul
name: Agnikul Cosmos
description: >-
  Agnikul Cosmos Private Limited is an Indian aerospace manufacturer and commercial launch service
  provider founded in 2017 and incubated at the National Centre for Combustion Research and
  Development at IIT Madras, Chennai. It builds Agnibaan, a configurable small-lift orbital launch
  vehicle powered by Agnilet — a single-piece, fully 3D-printed semi-cryogenic rocket engine — and
  flies it from Dhanush (ALP-01), India's first privately built launchpad, at Satish Dhawan Space
  Centre. On 30 May 2024 its Agnibaan SOrTeD suborbital demonstrator became the first vehicle to fly
  from a privately built launchpad in India. Agnikul publishes NO API for its launch business: launch
  is sold per kilogram through an HTML enquiry form, with no developer portal, no OpenAPI and no
  mission or manifest API anywhere. What it does publish is a genuine, hand-authored corporate
  /llms.txt and /llms-full.txt about the launch programme, and — on its Cosmos Store merchandise
  storefront at shop.agnikul.in — a live, anonymous agent-commerce surface: a /.well-known/ucp
  merchant profile implementing the Universal Commerce Protocol 2026-08-25 and two Model Context
  Protocol endpoints offering fourteen catalog, cart, checkout, order and policy tools.
