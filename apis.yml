- aid: agnikul:agnikul-cosmos-store-storefront-json-api
  name: Agnikul Cosmos Store Storefront JSON API
  description: >-
    The read-only storefront JSON endpoints Cosmos Store documents for agents in its own /agents.md
    and /llms.txt — product JSON at /products/{handle}.json, collection product listings at
    /collections/{handle}/products.json, product search, and the sitemap. No authentication is
    required. These are Shopify Online Store routes served on Agnikul's own shop subdomain and named
    by the store in its own agent instructions.
  image: https://shop.agnikul.in/cdn/shop/files/logo.png?v=1705750282
  humanURL: https://shop.agnikul.in/llms.txt
  baseURL: https://shop.agnikul.in
  x-base-note: >-
    The storefront origin IS the API base for this entry, not a marketing URL standing in for one.
    https://shop.agnikul.in/collections/all/products.json returned HTTP 200 application/json with
    eleven products on 2026-09-12. The sibling api entry deliberately carries a longer base
    (/api/ucp/mcp) because the MCP endpoint is a single POST target, not a path space.
  tags:
  - Products
  - Collections
  - Catalog
  - Sitemap
  properties:
  - type: Documentation
    url: https://shop.agnikul.in/agents.md
  - type: LLMsTxt
    url: llms/agnikul-shop-llms.txt
