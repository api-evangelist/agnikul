apis:
- aid: agnikul:agnikul-cosmos-store-commerce-mcp-api
  name: Agnikul Cosmos Store Commerce MCP API
  description: >-
    The agent-facing commerce surface for Cosmos Store, Agnikul's branded merchandise shop,
    implementing the Universal Commerce Protocol (dev.ucp.shopping) over MCP. Thirteen tools cover
    catalog search and lookup, product detail, cart create/update/cancel, checkout
    create/update/complete/cancel, and order retrieval; a second endpoint adds one policy-and-FAQ
    question-answering tool. Anonymous — no API key or OAuth token is required to list tools or
    search the catalog — but completing a checkout requires an idempotency key and contemporaneous
    buyer approval of payment. This sells t-shirts and mission patches, not launches.
  image: https://shop.agnikul.in/cdn/shop/files/logo.png?v=1705750282
  humanURL: https://shop.agnikul.in/agents.md
  baseURL: https://shop.agnikul.in/api/ucp/mcp
  x-base-note: >-
    The endpoint named in the store's own agents.md and llms.txt, probed live at HTTP 200 on
    2026-09-12. The machine-readable /.well-known/ucp profile names the equivalent Shopify permanent
    domain form https://40146b.myshopify.com/api/ucp/mcp; both answer with identical tool sets.
  tags:
  - Commerce
  - Catalog
  - Cart
  - Checkout
  - Orders
  - Agentic Commerce
