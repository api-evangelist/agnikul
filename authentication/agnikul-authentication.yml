name: Agnikul authentication profile
slug: agnikul

summary: >-
  Agnikul publishes no API keys and runs no developer key-issuance program on any host. Its one
  programmable surface — the Cosmos Store commerce MCP endpoint — is anonymous: initialize,
  tools/list, catalog search, product lookup, cart and checkout creation all succeed with no
  credential. Authorization moves to the payment step rather than the transport step: completing a
  checkout requires a buyer-approved payment instrument and an idempotency key. A separate OAuth 2.0
  / OpenID Connect authorization server exists for store customer accounts. The launch-services
  business at agnikul.in has no authenticated surface at all — no login, no portal, no account system.

schemes:
- id: none
  surface: Agnikul Cosmos Store Commerce MCP API
  endpoint: https://shop.agnikul.in/api/ucp/mcp
  type: none
  verified: probed
  evidence:
    request: 'POST tools/list with no Authorization header'
    http_status: 200
    result: 13 tools returned with full inputSchemas
  note: >-
    No API key, bearer token or client credential is required or accepted for tool discovery or for
    catalog, cart and checkout operations.

- id: ucp-agent-profile
  surface: Agnikul Cosmos Store Commerce MCP API
  type: agent-identity
  required: true
  location: request body — meta.ucp-agent
  format: object carrying the agent's UCP profile URI
  verified: probed
  note: >-
    Not authentication in the credential sense, but a required identity input on all 13 tools: every
    inputSchema lists meta as required and meta.required includes "ucp-agent". The server identifies
    the calling agent, not the user.

- id: payment-instrument
  surface: Agnikul Cosmos Store Commerce MCP API — complete_checkout
  type: buyer-authorization
  required: true
  location: request body — checkout payment instruments
  verified: probed
  handlers:
  - id: gpay
    handler: com.google.pay
    version: '2026-01-11'
    merchant_name: Cosmos Store
    merchant_id: '16708973830884969730'
    merchant_origin: shop.agnikul.in
    gateway: shopify
    gateway_merchant_id: '85860712758'
    card_networks: [VISA, MASTERCARD, AMEX, DISCOVER]
    auth_methods: [PAN_ONLY, CRYPTOGRAM_3DS]
    billing_address_required: true
  - id: shopify.card
    handler: dev.shopify.card
    version: '2026-01-15'
    card_brands: [visa, master, american_express, discover, diners_club]
  shop_pay_absent: true
  shop_pay_note: >-
    Unlike most Shopify UCP merchants, this store's profile declares only two payment handlers —
    dev.shopify.shop_pay is NOT advertised — while the store's own agents.md tells agents to route
    through Shop Pay when they cannot get contemporaneous buyer approval. The advice and the declared
    handler set disagree.
  note: >-
    The store's robots.txt and agents.md both state the rule explicitly: "Checkouts are for humans.
    Do NOT complete checkout, payment, or order placement automatically ... without an explicit,
    contemporaneous human approval step."

